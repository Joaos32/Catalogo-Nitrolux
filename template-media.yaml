AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 media bucket delivered through a CloudFront CDN.

Parameters:
  MediaBucketName:
    Type: String
    Default: ""
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  VercelTeamSlug:
    Type: String
    Default: joao-vitors-projects-bbed36cf
  VercelProjectName:
    Type: String
    Default: catalogo

Conditions:
  HasMediaBucketName: !Not [!Equals [!Ref MediaBucketName, ""]]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasMediaBucketName, !Ref MediaBucketName, !Ref AWS::NoValue]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  MediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Access to the private catalog media bucket
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-media-cache"
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Catalog media - ${AWS::StackName}"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Origins:
          - Id: MediaBucketOrigin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref MediaOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref MediaCachePolicy
          Compress: true
          TargetOriginId: MediaBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/produtos/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}"

  VercelOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList:
        - https://vercel.com/joao-vitors-projects-bbed36cf
      Url: https://oidc.vercel.com/joao-vitors-projects-bbed36cf
      Tags:
        - Key: Project
          Value: catalogo

  RepresentativeRegistryRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Temporary Vercel OIDC access to the representative registry object
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.vercel.com/joao-vitors-projects-bbed36cf:aud: https://vercel.com/joao-vitors-projects-bbed36cf
                oidc.vercel.com/joao-vitors-projects-bbed36cf:sub:
                  - !Sub "owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:production"
                  - !Sub "owner:${VercelTeamSlug}:project:${VercelProjectName}:environment:preview"
      Policies:
        - PolicyName: RepresentativeRegistryObjectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${MediaBucket.Arn}/private/representative_users.json"

Outputs:
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaDistributionId:
    Value: !Ref MediaDistribution
  MediaCdnBaseUrl:
    Value: !Sub "https://${MediaDistribution.DomainName}"
  RepresentativeRegistryRoleArn:
    Value: !GetAtt RepresentativeRegistryRole.Arn
